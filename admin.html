<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aracribs | Administrator Portal</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffb300' stroke-width='2.2'><path d='M12 2a4 4 0 0 0-4 4v2H6a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h2v4a4 4 0 0 0 8 0v-4h2a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-2V6a4 4 0 0 0-4-4z'/></svg>" />
    <script>
      // Instantly open the Admin Console on the separate link
      window.location.replace('/#admin');
    </script>
    <style>
      body {
        background-color: #0a0c0d;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .loader-card {
        text-align: center;
        padding: 2rem;
        background: #14171a;
        border: 1px solid rgba(255, 179, 0, 0.3);
        border-radius: 12px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 179, 0, 0.2);
        border-top-color: #ffb300;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 1rem;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="loader-card">
      <div class="spinner"></div>
      <h3>👑 Opening Aracribs Admin Console...</h3>
      <p style="color: #9e9e9e; font-size: 0.9rem;">Connecting to persistent database & secure admin portal</p>
    </div>
  </body>
</html>
